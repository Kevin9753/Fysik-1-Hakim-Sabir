<!doctype html>
<html lang="sv">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Quiz - Fysik 1</title>
    <!-- Länkar till gemensam CSS för sidan -->
    <link rel="stylesheet" href="../css/style.css" />
  </head>

  <body id="home">
    <header class="navbar">
      <nav>
        <ul class="nav-links">
          <!-- Länkar till andra sidor i samma mapp -->
          <li><a href="index.html">Hem</a></li>
          <li><a href="rorelse.html">Rörelse</a></li>
          <li><a href="krafter.html">Krafter</a></li>
          <li><a href="vagor.html">Vågor</a></li>
          <li><a href="energi.html">Energi</a></li>
          <li><a href="about.html">Om</a></li>
        </ul>
      </nav>
    </header>

    <main class="container">
      <h1>Övningsquiz — 10 frågor</h1>
      <p class="muted">
        Välj det svar du tror är rätt. Enkla frågor i Fysik 1.
      </p>

      <div id="quiz-container">
        <div id="question-box"></div>
        <ul id="answers-list"></ul>
        <div class="quiz-controls">
          <button id="next-btn" class="btn">Nästa</button>
        </div>
        <div id="result" style="display: none"></div>
      </div>

      <div class="calculator-section">
        <br />
        <h1>Miniräknare</h1>
        <div class="calculator-box">
          <!--Miniräknare-->
          <input
            type="text"
            id="calc-input"
            placeholder="Skriv ett matteproblem, t.ex. 2+2*3"
          />
          <button onclick="calculate()">Beräkna</button
          ><!--När man klickar på knappen körs metoden calculate()-->
          <p id="calc-result"></p>
        </div>
      </div>
    </main>

    <!-- Sidfot -->
    <footer>
      © 2026 Fysik 1 - Enkel övningssajt

      <p>
        <a href="https://jigsaw.w3.org/css-validator/check/referer">
          <img
            style="border: 0; width: 88px; height: 31px"
            src="https://jigsaw.w3.org/css-validator/images/vcss-blue"
            alt="Valid CSS!"
          />
        </a>
      </p>
    </footer>

    <script src="../js/script.js"></script>
  </body>
</html>
